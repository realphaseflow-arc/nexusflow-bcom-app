<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusFlow - B.Com Commerce & Auditing Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-start p-4 md:p-8">
  
  <!-- Header & Download Controls -->
  <div class="max-w-4xl w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center mb-6">
    <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">
      📊
    </div>
    <h1 class="text-2xl md:text-3xl font-bold mb-1">NexusFlow</h1>
    <p class="text-slate-400 text-sm mb-4">B.Com Commerce & Auditing Suite for Android</p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="https://console.firebase.google.com/project/nexusflow-87b50/authentication/users?utm_source=gemini5" 
         class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2.5 px-6 rounded-xl transition-all shadow-lg text-sm">
        📲 Download APK (25.4 MB)
      </a>
      <a href="https://github.com/realphaseflow-arc/nexusflow-bcom-app/releases/tag/v1" 
         class="w-full sm:w-auto bg-slate-700 hover:bg-slate-600 text-white font-medium py-2.5 px-6 rounded-xl transition-all text-sm">
        📦 View Release Details
      </a>
    </div>
  </div>

  <!-- Embedded Live Preview Window -->
  <div class="max-w-4xl w-full bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden shadow-2xl">
    <div class="bg-slate-750 px-4 py-3 border-b border-slate-700 flex items-center justify-between text-xs text-slate-400">
      <span class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Live Interactive App Preview
      </span>
      <span>Interactive Prototype</span>
    </div>
    
    <div class="relative w-full h-[650px] bg-slate-950">
      <iframe 
        src="https://aistudio.google.com/apps/b9510d38-f957-4e69-b773-dea4e19a822b?showPreview=true" 
        class="w-full h-full border-0"
        title="NexusFlow Web Preview"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
    </div>
  </div>

  <div class="mt-6 text-xs text-slate-500 text-center">
    Designed for Bharathiar University B.Com Commerce & Auditing Students
  </div>
