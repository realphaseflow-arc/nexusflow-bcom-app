<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusFlow - B.Com Commerce & Auditing Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-start p-4 md:p-8">
  
  <!-- Header & Action Section -->
  <div class="max-w-4xl w-full bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 text-center mb-6">
    <div class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl font-bold text-slate-900">
      📊
    </div>
    <h1 class="text-2xl md:text-3xl font-bold mb-1">NexusFlow</h1>
    <p class="text-slate-400 text-sm mb-4">B.Com Commerce & Auditing Suite for Android</p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <!-- APK Download Button -->
      <a href="https://github.com/realphaseflow-arc/nexusflow-bcom-app/releases/download/v1/NexusFlow.apk" 
         class="w-full sm:w-auto bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2.5 px-6 rounded-xl transition-all shadow-lg text-sm">
        📲 Download APK (25.4 MB)
      </a>

      <!-- Show Preview Toggle Button -->
      <button onclick="document.getElementById('preview-container').scrollIntoView({ behavior: 'smooth' });" 
              class="w-full sm:w-auto bg-slate-700 hover:bg-slate-600 text-emerald-400 font-semibold py-2.5 px-6 rounded-xl transition-all border border-emerald-500/30 text-sm flex items-center justify-center gap-2">
        <span>📱 Interactive App Preview</span>
      </button>

      <a href="https://github.com/realphaseflow-arc/nexusflow-bcom-app/releases/tag/v1" 
         class="w-full sm:w-auto bg-slate-800 hover:bg-slate-750 text-slate-300 font-medium py-2.5 px-6 rounded-xl transition-all border border-slate-700 text-sm">
        📦 GitHub Release
      </a>
    </div>
  </div>

  <!-- Live Android APK Phone Simulator -->
  <div id="preview-container" class="max-w-4xl w-full bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-2xl flex flex-col items-center">
    <div class="text-center mb-4">
      <h2 class="text-lg font-bold text-slate-200">📱 Live Android App Simulator</h2>
      <p class="text-xs text-slate-400">Click or tap screen below to interact with the NexusFlow Android app live in your browser.</p>
    </div>

    <!-- Appetize Android Phone Frame -->
    <div class="relative w-full flex justify-center py-2">
      <iframe 
        src="https://appetize.io/embed/b_yzpj6xz7rhpx4oby6q5jbtptjm?device=nexus5&osVersion=11.0&scale=85" 
        width="340" 
        height="680" 
        frameborder="0" 
        scrolling="no"
        class="rounded-3xl border-4 border-slate-700 shadow-2xl">
      </iframe>
    </div>
  </div>

  <div class="mt-8 text-xs text-slate-500 text-center">
    Designed for B.Com Commerce & Auditing Students
  </div>

</body>
</html>
