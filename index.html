<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusFlow - B.Com Commerce & Auditing Suite</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function NexusFlowApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [quizAnswer, setQuizAnswer] = useState(null);
      const [chatMessages, setChatMessages] = useState([
        { sender: 'ai', text: 'Hello! I am your NexusFlow AI Audit Assistant. Ask me anything about Vouching, Verification, or Companies Act 2013!' }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [checklist, setChecklist] = useState({ step1: false, step2: false, step3: false });
      const [flashcardFlipped, setFlashcardFlipped] = useState(false);

      const handleSendMessage = () => {
        if (!chatInput.trim()) return;
        setChatMessages(prev => [...prev, { sender: 'user', text: chatInput }]);
        const userMsg = chatInput;
        setChatInput('');
        setTimeout(() => {
          setChatMessages(prev => [...prev, { 
            sender: 'ai', 
            text: `Under B.Com Auditing principles regarding "${userMsg}": Ensure proper vouchers, authorization entries, and compliance under Section 139/143 of Companies Act 2013.` 
          }]);
        }, 800);
      };

      return (
        <div className="flex flex-col min-h-screen">
          <!-- Top Header -->
          <header className="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg">
                📊
              </div>
              <div>
                <h1 className="font-bold text-lg text-white leading-none">NexusFlow</h1>
                <span className="text-xs text-emerald-400 font-medium">B.Com Auditing & Commerce Suite</span>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <a href="https://github.com/realphaseflow-arc/nexusflow-bcom-app/releases/download/v1/NexusFlow.apk" 
                 className="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-semibold px-4 py-2 rounded-lg text-xs transition-all shadow-md">
                📲 Download Android APK
              </a>
            </div>
          </header>

          <div className="flex flex-1">
            <!-- Sidebar Navigation -->
            <aside className="w-64 bg-slate-800/50 border-r border-slate-700 p-4 hidden md:flex flex-col gap-2">
              <div className="text-xs font-semibold text-slate-400 px-3 py-2 uppercase tracking-wider">Modules Navigation</div>
              
              <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                📌 Dashboard Overview
              </button>
              
              <button onClick={() => setActiveTab('modules')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'modules' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                📚 Syllabus & Modules
              </button>
              
              <button onClick={() => setActiveTab('ai')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'ai' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                🤖 AI Audit Tutor
              </button>

              <button onClick={() => setActiveTab('cases')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'cases' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                📂 Case Simulations
              </button>

              <button onClick={() => setActiveTab('flashcards')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'flashcards' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                🎴 Flashcard Deck
              </button>

              <button onClick={() => setActiveTab('settings')} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'settings' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                ⚙️ Exam Preferences
              </button>
            </aside>

            <!-- Viewport Content Area -->
            <main className="flex-1 p-6 max-w-5xl mx-auto w-full">
              
              {/* VIEW 1: DASHBOARD */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-r from-slate-800 to-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <h2 className="text-2xl font-bold text-white mb-1">Welcome back, B.Com Scholar! 👋</h2>
                      <p className="text-slate-400 text-sm">Ready to tackle Unit III: Vouching and Verification today?</p>
                    </div>
                    <div className="bg-slate-900/60 border border-slate-700/60 px-4 py-2 rounded-xl text-emerald-400 font-semibold text-sm flex items-center gap-2">
                      <span>🔥 14-Day Study Streak</span>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div className="text-slate-400 text-xs font-medium mb-1">Modules Mastered</div>
                      <div className="text-2xl font-bold text-white mb-2">4 / 6</div>
                      <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div className="bg-emerald-500 h-full w-3/4"></div>
                      </div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div className="text-slate-400 text-xs font-medium mb-1">Quiz Accuracy</div>
                      <div className="text-2xl font-bold text-emerald-400 mb-1">88.4%</div>
                      <div className="text-xs text-slate-400">+4.2% from last week</div>
                    </div>

                    <div className="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div className="text-slate-400 text-xs font-medium mb-1">Saved Revision Flashcards</div>
                      <div className="text-2xl font-bold text-white mb-1">38 Cards</div>
                      <div className="text-xs text-emerald-400">Companies Act 2013 Ready</div>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 2: SYLLABUS & MODULES */}
              {activeTab === 'modules' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">B.Com Auditing Modules Hub</h2>
                  <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                    <div className="border-b border-slate-700 pb-3">
                      <span className="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-500/20">Unit III</span>
                      <h3 className="text-lg font-bold text-white mt-1">Vouching and Verification</h3>
                    </div>

                    <div className="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                      <p className="text-sm font-semibold text-slate-200">Practice Question: What is the primary objective of vouching cash receipts?</p>
                      <div className="space-y-2">
                        <button onClick={() => setQuizAnswer('A')} className={`w-full text-left p-3 rounded-lg border text-sm transition-all ${quizAnswer === 'A' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 hover:bg-slate-750'}`}>
                          A. Ensuring all cash received has been recorded in the Cash Book accurately.
                        </button>
                        <button onClick={() => setQuizAnswer('B')} className={`w-full text-left p-3 rounded-lg border text-sm transition-all ${quizAnswer === 'B' ? 'bg-red-500/20 border-red-500 text-red-300' : 'bg-slate-800 border-slate-700 hover:bg-slate-750'}`}>
                          B. Verification of board members under Section 139.
                        </button>
                      </div>

                      {quizAnswer === 'A' && (
                        <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-xs text-emerald-300 font-medium">
                          ✅ Correct! Vouching verifies that cash transactions are authorized and entered in the Cash Book.
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 3: AI AUDIT ASSISTANT */}
              {activeTab === 'ai' && (
                <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                  <h2 className="text-xl font-bold text-white">🤖 AI Audit Assistant</h2>
                  <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 h-72 overflow-y-auto space-y-3 text-sm">
                    {chatMessages.map((msg, index) => (
                      <div key={index} className={`p-3 rounded-xl border max-w-lg ${msg.sender === 'ai' ? 'bg-slate-800 border-slate-700 text-slate-200' : 'bg-emerald-500/20 border-emerald-500/30 text-emerald-300 ml-auto'}`}>
                        <span className="text-xs font-bold block mb-1">{msg.sender === 'ai' ? 'NexusFlow AI' : 'You'}</span>
                        {msg.text}
                      </div>
                    ))}
                  </div>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      value={chatInput} 
                      onChange={(e) => setChatInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleSendMessage()}
                      placeholder="Ask an auditing question..." 
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" 
                    />
                    <button onClick={handleSendMessage} className="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-5 py-2 rounded-xl text-sm transition-all">
                      Send
                    </button>
                  </div>
                </div>
              )}

              {/* VIEW 4: CASE SIMULATIONS */}
              {activeTab === 'cases' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">📂 Audit Case Simulation</h2>
                  <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                    <div className="bg-slate-900/80 p-4 rounded-xl border border-slate-700">
                      <span className="text-xs text-emerald-400 font-bold uppercase tracking-wide">Case #102 - Inventory Cutoff</span>
                      <p className="text-sm text-slate-300 mt-2">
                        ABC Corp recorded $200,000 worth of goods-in-transit twice as of March 31. What audit procedures must be executed?
                      </p>
                    </div>

                    <div className="space-y-2 text-sm">
                      <label className="flex items-center gap-3 p-3 bg-slate-900/40 rounded-xl border border-slate-700/60 cursor-pointer">
                        <input type="checkbox" checked={checklist.step1} onChange={(e) => setChecklist({...checklist, step1: e.target.checked})} className="accent-emerald-500 w-4 h-4" />
                        <span>Inspect Goods Received Notes (GRN) and cutoff dates</span>
                      </label>
                      <label className="flex items-center gap-3 p-3 bg-slate-900/40 rounded-xl border border-slate-700/60 cursor-pointer">
                        <input type="checkbox" checked={checklist.step2} onChange={(e) => setChecklist({...checklist, step2: e.target.checked})} className="accent-emerald-500 w-4 h-4" />
                        <span>Cross-check supplier statements against Accounts Payable ledger</span>
                      </label>
                    </div>

                    {checklist.step1 && checklist.step2 && (
                      <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-xl text-xs text-emerald-300 font-medium">
                        🎉 Correct diagnostic procedure selected! Statutory risk mitigated under Companies Act provisions.
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* VIEW 5: FLASHCARDS */}
              {activeTab === 'flashcards' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-white">🎴 Active Recall Flashcards</h2>
                  <div 
                    onClick={() => setFlashcardFlipped(!flashcardFlipped)}
                    className="bg-slate-800 rounded-2xl border border-slate-700 p-10 shadow-2xl text-center cursor-pointer min-h-[220px] flex flex-col items-center justify-center transition-all hover:border-emerald-500/50">
                    {!flashcardFlipped ? (
                      <div>
                        <span className="text-xs text-slate-400 font-bold uppercase tracking-wider block mb-2">Question (Tap to flip)</span>
                        <p className="text-lg font-bold text-white">Section 139: What is the tenure of an individual company auditor?</p>
                      </div>
                    ) : (
                      <div>
                        <span className="text-xs text-emerald-400 font-bold uppercase tracking-wider block mb-2">Answer</span>
                        <p className="text-lg font-bold text-emerald-300">5 consecutive years (1 term of 5 years for individual auditors).</p>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* VIEW 6: SETTINGS */}
              {activeTab === 'settings' && (
                <div className="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                  <h2 className="text-xl font-bold text-white">⚙️ Exam & Course Preferences</h2>
                  <div className="space-y-4 text-sm">
                    <div>
                      <label className="text-xs font-semibold text-slate-400 block mb-1">Target B.Com Semester</label>
                      <select className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-slate-200">
                        <option>Semester V - Auditing & Corporate Governance</option>
                        <option>Semester VI - Financial Management</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-slate-400 block mb-1">Daily Study Pace Target</label>
                      <input type="range" className="w-full accent-emerald-500" min="15" max="120" defaultValue="45" />
                      <span className="text-xs text-slate-400">45 Minutes per day</span>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NexusFlowApp />);
  </script>
</body>
</html>
