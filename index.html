<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NexusFlow - B.Com Commerce & Auditing Suite</title>
  
  <!-- Tailwind CSS & React Scripts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function NexusFlowApp() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [quizAnswer, setQuizAnswer] = useState(null);

      return (
        <div class="flex flex-col min-h-screen">
          <!-- Top Header -->
          <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center font-bold text-slate-900 text-xl shadow-lg">
                📊
              </div>
              <div>
                <h1 class="font-bold text-lg text-white leading-none">NexusFlow</h1>
                <span class="text-xs text-emerald-400 font-medium">B.Com Auditing & Commerce Suite</span>
              </div>
            </div>

            <div class="flex items-center gap-3">
              <a href="https://github.com/realphaseflow-arc/nexusflow-bcom-app/releases/download/v1/NexusFlow.apk" 
                 class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-semibold px-4 py-2 rounded-lg text-xs transition-all shadow-md">
                📲 Download Android APK
              </a>
            </div>
          </header>

          <div class="flex flex-1">
            <!-- Sidebar Navigation -->
            <aside class="w-64 bg-slate-800/50 border-r border-slate-700 p-4 hidden md:flex flex-col gap-2">
              <div class="text-xs font-semibold text-slate-400 px-3 py-2 uppercase tracking-wider">Navigation</div>
              <button 
                onClick={() => setActiveTab('dashboard')} 
                class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'dashboard' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                📌 Dashboard Overview
              </button>
              <button 
                onClick={() => setActiveTab('modules')} 
                class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'modules' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                📚 Syllabus & Modules
              </button>
              <button 
                onClick={() => setActiveTab('ai')} 
                class={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${activeTab === 'ai' ? 'bg-emerald-500 text-slate-900 font-bold shadow-md' : 'text-slate-300 hover:bg-slate-700/50'}`}>
                🤖 AI Audit Tutor
              </button>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 p-6 max-w-5xl mx-auto w-full">
              {activeTab === 'dashboard' && (
                <div class="space-y-6">
                  <!-- Welcome Banner -->
                  <div class="bg-gradient-to-r from-slate-800 to-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                      <h2 class="text-2xl font-bold text-white mb-1">Welcome back, B.Com Scholar! 👋</h2>
                      <p class="text-slate-400 text-sm">Ready to tackle Unit III: Vouching and Verification today?</p>
                    </div>
                    <div class="bg-slate-900/60 border border-slate-700/60 px-4 py-2 rounded-xl text-emerald-400 font-semibold text-sm flex items-center gap-2">
                      <span>🔥 14-Day Study Streak</span>
                    </div>
                  </div>

                  <!-- Metric Grid -->
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div class="text-slate-400 text-xs font-medium mb-1">Modules Mastered</div>
                      <div class="text-2xl font-bold text-white mb-2">4 / 6</div>
                      <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                        <div class="bg-emerald-500 h-full w-3/4"></div>
                      </div>
                    </div>

                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div class="text-slate-400 text-xs font-medium mb-1">Quiz Accuracy</div>
                      <div class="text-2xl font-bold text-emerald-400 mb-1">88.4%</div>
                      <div class="text-xs text-slate-400">+4.2% from last week</div>
                    </div>

                    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-md">
                      <div class="text-slate-400 text-xs font-medium mb-1">Saved Revision Flashcards</div>
                      <div class="text-2xl font-bold text-white mb-1">38 Cards</div>
                      <div class="text-xs text-emerald-400">Companies Act 2013 Ready</div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'modules' && (
                <div class="space-y-6">
                  <h2 class="text-xl font-bold text-white">B.Com Auditing Modules</h2>

                  <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                    <div class="flex justify-between items-center border-b border-slate-700 pb-4">
                      <div>
                        <span class="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-1 rounded-md border border-emerald-500/20">Unit III</span>
                        <h3 class="text-lg font-bold text-white mt-2">Vouching and Verification</h3>
                      </div>
                    </div>

                    <div class="bg-slate-900/60 p-4 rounded-xl border border-slate-700/60 space-y-3">
                      <p class="text-sm font-semibold text-slate-200">Practice Question: What is the primary objective of vouching cash receipts?</p>
                      
                      <div class="space-y-2">
                        <button 
                          onClick={() => setQuizAnswer('A')}
                          class={`w-full text-left p-3 rounded-lg border text-sm transition-all ${quizAnswer === 'A' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-800 border-slate-700 hover:bg-slate-750'}`}>
                          A. Ensuring all cash received has been recorded in the Cash Book.
                        </button>
                        <button 
                          onClick={() => setQuizAnswer('B')}
                          class={`w-full text-left p-3 rounded-lg border text-sm transition-all ${quizAnswer === 'B' ? 'bg-red-500/20 border-red-500 text-red-300' : 'bg-slate-800 border-slate-700 hover:bg-slate-750'}`}>
                          B. Checking auditor appointment letters under Section 139.
                        </button>
                      </div>

                      {quizAnswer === 'A' && (
                        <div class="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-xs text-emerald-300 font-medium">
                          ✅ Correct! Vouching verifies that cash transactions are properly authorized and accurately entered in the Cash Book.
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'ai' && (
                <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 shadow-xl space-y-4">
                  <h2 class="text-xl font-bold text-white">🤖 AI Audit Assistant</h2>
                  <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 h-64 overflow-y-auto space-y-3 text-sm">
                    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 max-w-lg">
                      <span class="text-xs font-bold text-emerald-400 block mb-1">NexusFlow AI</span>
                      Hello! I am your B.Com Auditing assistant. Ask me anything about Vouching, Verification, or the Companies Act 2013!
                    </div>
                  </div>
                  <div class="flex gap-2">
                    <input type="text" placeholder="Type an auditing question..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500" />
                    <button class="bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold px-5 py-2 rounded-xl text-sm transition-all">Send</button>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<NexusFlowApp />);
  </script>
</body>
</html>
